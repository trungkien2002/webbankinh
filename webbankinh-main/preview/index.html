function glasses(color='#42352a',lens='#eef2e9',round=false){const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310"><defs><filter id="s"><feGaussianBlur stdDeviation="9"/></filter><linearGradient id="l" x2="1" y2="1"><stop stop-color="'+lens+'" stop-opacity=".8"/><stop offset="1" stop-color="'+lens+'" stop-opacity=".25"/></linearGradient></defs><ellipse cx="303" cy="238" rx="220" ry="13" fill="#000" opacity=".09" filter="url(#s)"/><path d="M71 113L154 51Q171 36 188 45L385 92M527 113L434 51Q421 40 404 48L228 91" fill="none" stroke="'+color+'" stroke-width="9" stroke-linecap="round"/>'+ (round?'<ellipse cx="184" cy="153" rx="98" ry="73"/><ellipse cx="417" cy="153" rx="98" ry="73"/>':'<path d="M85 104Q180 81 280 107L265 174Q256 217 186 219Q109 220 97 174Z"/><path d="M319 107Q418 81 514 104L502 174Q487 218 419 219Q344 218 332 174Z"/>').replaceAll('/>',' fill="url(#l)" stroke="'+color+'" stroke-width="12"/>')+'<path d="M279 123Q300 111 321 123M78 110L57 109M520 110L542 109" fill="none" stroke="'+color+'" stroke-width="10"/><path d="M126 120L146 119M365 120L387 117" stroke="white" opacity=".6" stroke-width="5" stroke-linecap="round"/></svg>';return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}

function image(p){return glasses(p.color,p.lens||'#edf2e8',p.round)}function shopHeader(){return '<div class="topline">MỘT GÓC NHÌN MỚI. MỘT PHONG CÁCH RIÊNG.</div><nav class="shopnav"><button class="wordmark" onclick="shopPage=\'home\';showShop()">ÉLAN</button><div class="links"><button onclick="shopPage=\'catalog\';filter=\'Gọng kính\';showShop()">Gọng kính</button><button onclick="shopPage=\'catalog\';filter=\'Kính râm\';showShop()">Kính râm</button><button onclick="shopPage=\'catalog\';filter=\'Tất cả\';showShop()">Bộ sưu tập</button></div><div><button onclick="goAdmin()">Quản lý cửa hàng ↗</button><button onclick="shopPage=\'cart\';showShop()">Giỏ hàng ('+cart.reduce((a,b)=>a+b.qty,0)+')</button></div></nav>'}
